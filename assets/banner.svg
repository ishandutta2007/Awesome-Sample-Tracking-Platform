:liquidBubble 2.5s ease-in-out infinite}.flow-path{stroke-dasharray:10,8;animation:flowLine 12s linear infinite}.node-pulse{animation:nodeBlink 3s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><circle cx="200" cy="180" r="140" fill="#00f2fe" class="pulse-elem" filter="url(#glow)" opacity=".08"/><circle cx="1000" cy="220" r="160" fill="#7209b7" class="pulse-elem" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="100" r="120" fill="#4facfe" filter="url(#glow)" opacity=".06"/><path fill="none" stroke="#00f2fe" stroke-width="1.8" d="M 50 80 Q 250 20 450 120 T 850 100 T 1150 60" class="flow-path" opacity=".4"/><path style="animation-duration:8s" fill="none" stroke="#f72585" stroke-width="1.8" d="M 50 320 Q 300 380 600 280 T 950 320 T 1150 290" class="flow-path" opacity=".35"/><g transform="translate(70, 90)"><rect width="180" height="200" x="0" y="0" fill="#0e2238" stroke="#00f2fe" stroke-width="2" filter="url(#softGlow)" opacity=".85" rx="12"/><rect width="160" height="180" x="10" y="10" fill="#091829" stroke="#4facfe" stroke-width="1" opacity=".6" rx="8"/><text x="90" y="-12" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">CRYO-STORAGE 81-WELL</text><g transform="translate(25, 25)"><circle cx="20" cy="20" r="15" fill="#1b3a5c" stroke="#4facfe" stroke-width="1.5"/><circle cx="20" cy="20" r="11" fill="url(#liquidGrad)" class="bubble"/><circle cx="65" cy="20" r="15" fill="#1b3a5c" stroke="#4facfe" stroke-width="1.5"/><circle cx="65" cy="20" r="11" fill="url(#amberGrad)" class="bubble"/><circle cx="110" cy="20" r="15" fill="#1b3a5c" stroke="#4facfe" stroke-width="1.5"/><circle cx="110" cy="20" r="11" fill="url(#liquidGrad)" class="bubble"/><circle cx="20" cy="70" r="15" fill="#1b3a5c" stroke="#4facfe" stroke-width="1.5"/><circle cx="20" cy="70" r="11" fill="url(#liquidGrad)" class="